name: Validate API and provider contracts

on:
  push:
    branches: [main]
    paths:
      - "docs/specifications/**"
      - ".github/workflows/openapi-contract-validation.yml"
  pull_request:
    paths:
      - "docs/specifications/**"
      - ".github/workflows/openapi-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenAPI and provider schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI 3.1
        run: npx --yes @redocly/cli@1.34.5 lint docs/specifications/openapi-v1.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate provider contract schema and fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema_path = Path("docs/specifications/provider-contract-v1.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          fixtures = sorted(Path("docs/specifications/examples").glob("*.fixture.json"))
          if not fixtures:
              raise SystemExit("No provider contract fixtures found.")

          for fixture_path in fixtures:
              instance = json.loads(fixture_path.read_text(encoding="utf-8"))
              errors = sorted(validator.iter_errors(instance), key=lambda error: list(error.path))
              if errors:
                  for error in errors:
                      location = ".".join(str(part) for part in error.path) or "<root>"
                      print(f"{fixture_path}:{location}: {error.message}")
                  raise SystemExit(f"Schema validation failed: {fixture_path}")
              print(f"VALID: {fixture_path}")

          print(f"Validated {len(fixtures)} provider contract fixture(s).")
          PY
